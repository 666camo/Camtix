services:
  # ============ DATABASES ============
  postgres-user-db:
    image: postgres:17-alpine
    container_name: camtix-user-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: camtix_user_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
      - ./database/camtix_user_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d camtix_user_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-event-db:
    image: postgres:17-alpine
    container_name: camtix-event-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: camtix_event_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_event_data:/var/lib/postgresql/data
      - ./database/camtix_event_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d camtix_event_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-transaction-db:
    image: postgres:17-alpine
    container_name: camtix-transaction-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: camtix_transaction_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_transaction_data:/var/lib/postgresql/data
      - ./database/camtix_transaction_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d camtix_transaction_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ BACKEND SERVICES ============
  user-service:
    build:
      context: ./camtix-backend
      dockerfile: user-service/Dockerfile
    container_name: camtix-user-service
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-user-db:5432/camtix_user_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:?SPRING_MAIL_USERNAME is required}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:?SPRING_MAIL_PASSWORD is required}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-none}
      SERVER_PORT: 8081
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      MANAGEMENT_HEALTH_RABBIT_ENABLED: "false"
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
    ports:
      - "8081:8081"
    depends_on:
      postgres-user-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  event-service:
    build:
      context: ./camtix-backend
      dockerfile: event-service/Dockerfile
    container_name: camtix-event-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-event-db:5432/camtix_event_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-none}
      SERVER_PORT: 8082
      CACHE_TYPE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-camtix-internal-secret-key}
    ports:
      - "8082:8082"
    depends_on:
      postgres-event-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  transaction-service:
    build:
      context: ./camtix-backend
      dockerfile: transaction-service/Dockerfile
    container_name: camtix-transaction-service
    environment:
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-transaction-db:5432/camtix_transaction_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:?SPRING_MAIL_USERNAME is required}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:?SPRING_MAIL_PASSWORD is required}
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:8081}
      EVENT_SERVICE_URL: ${EVENT_SERVICE_URL:-http://event-service:8082}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-none}
      SERVER_PORT: 8083
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-camtix-internal-secret-key}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      MANAGEMENT_HEALTH_RABBIT_ENABLED: "false"
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
    ports:
      - "8083:8083"
    depends_on:
      postgres-transaction-db:
        condition: service_healthy
      user-service:
        condition: service_healthy
      event-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api-gateway:
    build:
      context: ./camtix-backend
      dockerfile: api-gateway/Dockerfile
    container_name: camtix-api-gateway
    environment:
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:8081}
      EVENT_SERVICE_URL: ${EVENT_SERVICE_URL:-http://event-service:8082}
      TRANSACTION_SERVICE_URL: ${TRANSACTION_SERVICE_URL:-http://transaction-service:8083}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      user-service:
        condition: service_healthy
      event-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============ FRONTEND ============
  frontend:
    build:
      context: ./camtix-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: camtix-frontend
    ports:
      - "80:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped

  # ============ INFRA ============
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: camtix-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: camtix-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: camtix-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_user_data:
  postgres_event_data:
  postgres_transaction_data:
  minio_data:
