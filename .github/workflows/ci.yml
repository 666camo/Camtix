name: CamTix CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build backend
        working-directory: camtix-backend
        run: mvn clean verify -DskipTests=false

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: camtix-frontend/package-lock.json

      - name: Install dependencies
        working-directory: camtix-frontend
        run: npm ci

      - name: Lint
        working-directory: camtix-frontend
        run: npm run lint

      - name: Build frontend
        working-directory: camtix-frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8080

  docker:
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker compose config
        run: docker compose config -q

      - name: Build Docker images
        run: docker compose build
