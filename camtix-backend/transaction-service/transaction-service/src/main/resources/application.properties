spring.application.name=transaction-service
server.port=${SERVER_PORT:8083}

# Koneksi ke PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/camtix_transaction_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Pengaturan JPA/Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# Mail Configurations
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Actuator Health Checks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Swagger/OpenAPI
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/api-docs

# Internal API Configurations
internal.api.key=${INTERNAL_API_KEY:}

# Midtrans Payment Gateway
midtrans.server-key=${MIDTRANS_SERVER_KEY:}
midtrans.client-key=${MIDTRANS_CLIENT_KEY:}
midtrans.is-production=${MIDTRANS_IS_PRODUCTION:false}

# RabbitMQ Configurations
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}
email.queue.name=camtix.email.queue
email.exchange.name=camtix.email.exchange
email.routing.key=camtix.email.routing.key

# JWT Configurations
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Services URLs
user.service.url=${USER_SERVICE_URL:http://localhost:8081}
event.service.url=${EVENT_SERVICE_URL:http://localhost:8082}

# Public ticket link used in confirmation emails
frontend.url=${FRONTEND_URL:http://localhost:5173}
